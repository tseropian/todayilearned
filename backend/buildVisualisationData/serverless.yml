service: til-build-visualisation-data

provider:
  name: aws
  runtime: nodejs22.x
  lambdaHashingVersion: 20201221
  region: eu-west-1
  environment:
    LINKS_TABLE: til-links-live
    METADATA_TABLE: til-wikipedia-metadata
    DATA_BUCKET: todayilearned-prod
    DATA_PREFIX: data

  iamRoleStatements:
    - Effect: Allow
      Action:
        - dynamodb:Scan
        - dynamodb:Query
        - dynamodb:GetItem
        - dynamodb:BatchGetItem
        - dynamodb:PutItem
        - dynamodb:BatchWriteItem
      Resource:
        - "arn:aws:dynamodb:${opt:region, self:provider.region}:*:table/${self:provider.environment.LINKS_TABLE}"
        - "arn:aws:dynamodb:${opt:region, self:provider.region}:*:table/${self:provider.environment.METADATA_TABLE}"
    - Effect: Allow
      Action:
        - s3:PutObject
        - s3:GetObject
      Resource: "arn:aws:s3:::${self:provider.environment.DATA_BUCKET}/${self:provider.environment.DATA_PREFIX}/*"

plugins:
  - serverless-offline

functions:
  build:
    handler: handler.build
    # Wikipedia enrichment on a cold cache can take a while; give it room.
    timeout: 900
    memorySize: 512
    events:
      # Daily at 03:00 UTC
      - schedule: cron(0 3 * * ? *)

  # HTTP endpoint that serves the published data (+ createdAt) to the website.
  serve:
    handler: serve.serve
    timeout: 15
    memorySize: 256
    events:
      - http:
          path: visualisation-data
          method: get
          cors: true
